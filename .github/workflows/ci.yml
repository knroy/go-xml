name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The fast gate: build, vet, unit tests, race. Runs on every push and needs
  # nothing external, so a broken commit is caught in about a minute.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      # Enforced, now that the tree is clean. It was advisory while drift
      # remained, because failing the build on it would have meant
      # reformatting unrelated files inside every unrelated change.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^testdata/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      # GOXSLT_NO_SUITES keeps the conformance suites out of the fast gate.
      # The suite harnesses fall back to ./testdata when their env var is
      # unset, so if a cached checkout is present they run here too -- which
      # is the conformance job's work done a second time, and under -race it
      # is slow enough to hit go test's 10m default and fail the build. The
      # figures those runs produce are ignored here in any case: this job
      # exists to catch a broken commit in about a minute.
      - run: go test ./... -count=1
        env:
          GOXSLT_NO_SUITES: '1'
      # -timeout is set explicitly rather than left at the 10m default,
      # because the default is what turned a slow run into a panic rather
      # than a slow run.
      - run: go test ./... -race -count=1 -timeout 25m
        env:
          GOXSLT_NO_SUITES: '1'

      # w3cschemas is a second module -- the schemas it bundles are under W3C
      # terms rather than MIT -- so every step above misses it: `go list ./...`
      # at the root does not cross a module boundary. Until this step existed
      # it was in no gate anywhere, and its go.mod named a published release,
      # so what its tests exercised was the module cache rather than this
      # tree. It imports xsd and xdm; an API break in either was invisible.
      #
      # It is measured against the go-xml RELEASE its go.mod names, not against
      # this tree: it is published separately, so the version it pins is the
      # version its users get. That means this step catches a broken
      # w3cschemas, not an API break here that would affect it -- bumping the
      # pin after a release is what closes that, and it is a release step.
      # GOFLAGS=-mod=readonly keeps a CI run from papering over a go.mod that
      # needs tidying.
      - name: w3cschemas (separate module)
        working-directory: w3cschemas
        env:
          GOFLAGS: -mod=readonly
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

  # The conformance gate. These suites are third-party and are not vendored,
  # so CI fetches them — which is also the only place they are fetched
  # reproducibly. Without this job the published percentages depend on someone
  # remembering to run tests/check.sh, and a number nobody re-measures is a
  # number that quietly stops being true.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Cache the conformance suites
        id: suites
        uses: actions/cache@v4
        with:
          path: testdata
          key: suites-v2

      # The four W3C suites and nothing else. DocBook xslTNG and XSpec are
      # measured too, and are deliberately not fetched here: each needs a build
      # of its own before it yields anything to transform, which is a second
      # toolchain in this job for two corpora whose ratchet lines a developer
      # holds locally. UBL and CII are licensed and cannot be cloned at all.
      # check.sh reports those four as skipped, and says they are expected.
      - name: Fetch the conformance suites
        if: steps.suites.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p testdata
          git clone --depth 1 https://github.com/w3c/qt3tests.git testdata/qt3tests
          git clone --depth 1 https://github.com/w3c/xsdtests.git testdata/xsdtests
          mkdir -p testdata/relaxng
          git clone --depth 1 https://github.com/relaxng/jing-trang.git /tmp/jing-trang
          cp /tmp/jing-trang/mod/rng-validate/test/spectest.xml testdata/relaxng/
          git clone --depth 1 https://github.com/w3c/xslt30-test.git testdata/xslt30-test

      # check.sh treats a suite that is present but silent as a failure, which
      # is the property that matters: a check that did not run must not look
      # like a check that passed.
      - name: tests/check.sh
        run: tests/check.sh
