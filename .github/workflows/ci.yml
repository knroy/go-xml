name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The fast gate: build, vet, unit tests, race. Runs on every push and needs
  # nothing external, so a broken commit is caught in about a minute.
  test:
    # Three operating systems, because CLAUDE.md's rule 3 asks that file
    # handling work on all of them and nothing here had ever demonstrated it.
    # Path separators, symlink support, case sensitivity and the confinement
    # rules that os.Root enforces all differ on Windows, and a library that
    # resolves schema and DTD references by path is exactly the kind that
    # breaks there quietly. Only this job gets the matrix: the conformance job
    # clones about 944M of W3C corpora, and paying that three times buys
    # almost no signal the Linux run does not already give.
    #
    # fail-fast is off so that one platform's failure does not hide the other
    # two. The whole point of adding Windows is to SEE what it reports.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      # Enforced, now that the tree is clean. It was advisory while drift
      # remained, because failing the build on it would have meant
      # reformatting unrelated files inside every unrelated change.
      # bash explicitly: the default shell on a Windows runner is PowerShell,
      # where this script is not merely non-portable but silently wrong --
      # `grep` and `$(...)` are not what PowerShell parses. Every other step in
      # this job is a single `go` invocation and needs no such pin.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^testdata/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      # GOXSLT_NO_SUITES keeps the conformance suites out of the fast gate.
      # The suite harnesses fall back to ./testdata when their env var is
      # unset, so if a cached checkout is present they run here too -- which
      # is the conformance job's work done a second time, and under -race it
      # is slow enough to hit go test's 10m default and fail the build. The
      # figures those runs produce are ignored here in any case: this job
      # exists to catch a broken commit in about a minute.
      - run: go test ./... -count=1
        env:
          GOXSLT_NO_SUITES: '1'
      # -timeout is set explicitly rather than left at the 10m default,
      # because the default is what turned a slow run into a panic rather
      # than a slow run.
      # -race needs cgo, and cgo needs a C toolchain. GitHub's runners have
      # gcc so this passes here silently, which is the problem: an auditor
      # reproducing the gate locally with CGO_ENABLED=0, or in a slim
      # container without gcc, gets a failure whose message is about the
      # toolchain and reads as a broken test. Setting it explicitly makes the
      # prerequisite part of the recipe rather than a property of the runner.
      - run: go test ./... -race -count=1 -timeout 25m
        env:
          GOXSLT_NO_SUITES: '1'
          CGO_ENABLED: '1'

      # w3cschemas is a second module -- the schemas it bundles are under W3C
      # terms rather than MIT -- so every step above misses it: `go list ./...`
      # at the root does not cross a module boundary. Until this step existed
      # it was in no gate anywhere, and its go.mod named a published release,
      # so what its tests exercised was the module cache rather than this
      # tree. It imports xsd and xdm; an API break in either was invisible.
      #
      # It is measured against the go-xml RELEASE its go.mod names, not against
      # this tree: it is published separately, so the version it pins is the
      # version its users get. That means this step catches a broken
      # w3cschemas, not an API break here that would affect it -- bumping the
      # pin after a release is what closes that, and it is a release step.
      # GOFLAGS=-mod=readonly keeps a CI run from papering over a go.mod that
      # needs tidying.
      - name: w3cschemas (separate module)
        working-directory: w3cschemas
        env:
          GOFLAGS: -mod=readonly
        shell: bash
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

  # The conformance gate. These suites are third-party and are not vendored,
  # so CI fetches them — which is also the only place they are fetched
  # reproducibly. Without this job the published percentages depend on someone
  # remembering to run tests/check.sh, and a number nobody re-measures is a
  # number that quietly stops being true.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Cache the conformance suites
        id: suites
        uses: actions/cache@v4
        with:
          path: testdata
          key: suites-v2

      # The four W3C suites and nothing else. DocBook xslTNG and XSpec are
      # measured too, and are deliberately not fetched here: each needs a build
      # of its own before it yields anything to transform, which is a second
      # toolchain in this job for two corpora whose ratchet lines a developer
      # holds locally. UBL and CII are licensed and cannot be cloned at all.
      # check.sh reports those four as skipped, and says they are expected.
      - name: Fetch the conformance suites
        if: steps.suites.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p testdata
          # PINNED. These are the revisions tests/conformance/results.json
          # records the committed figures as measured against, and
          # TestRecordedSuiteRevisionsMatchTheCheckouts fails if the two
          # disagree. Cloning the default branch instead made every run
          # measure against whatever the suite happened to be that day: a
          # suite update could move a count with no change to this repository,
          # and the ratchet would fail on a commit that changed nothing, with
          # nothing to distinguish that from a real regression.
          #
          # To adopt a newer suite, change the SHA here, re-run
          # tests/check.sh, and update results.json in the same commit -- so
          # the count moves together with the reason it moved.
          clone_at() {
            git clone --no-checkout --filter=blob:none "$1" "$2"
            git -C "$2" fetch --depth 1 origin "$3"
            git -C "$2" checkout --detach "$3"
          }
          clone_at https://github.com/w3c/qt3tests.git testdata/qt3tests \
            201a6e466940cdfc727f4babfedcde5332b9f578
          clone_at https://github.com/w3c/xsdtests.git testdata/xsdtests \
            7bc3365c652a322f3d762021b3879eb92dae7e30
          clone_at https://github.com/w3c/xslt30-test.git testdata/xslt30-test \
            fddf1cf920087e791f13315d68dfbe874d97dc56
          # jing-trang is not recorded: only one file is taken from it, and
          # spectest.xml is the fixture rather than the checkout.
          mkdir -p testdata/relaxng
          git clone --depth 1 https://github.com/relaxng/jing-trang.git /tmp/jing-trang
          cp /tmp/jing-trang/mod/rng-validate/test/spectest.xml testdata/relaxng/

      # check.sh treats a suite that is present but silent as a failure, which
      # is the property that matters: a check that did not run must not look
      # like a check that passed.
      - name: tests/check.sh
        run: tests/check.sh

      # The provenance of the figures the step above just printed: Go version,
      # repo commit, the resolved module graph and its digest, GOOS/GOARCH, UTC
      # time, and the revision of each suite checkout. It is uploaded rather than committed because it describes a
      # MEASUREMENT, not a commit -- attached here it travels with the run
      # whose numbers it explains, which is what nobody could produce when an
      # outside report quoted counts from a tree we could not identify.
      #
      # if: always() because a FAILING run is when the question "measured
      # against what?" actually gets asked.
      - name: Upload the run's provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run
          path: tests/last-run.txt
          if-no-files-found: warn

      # The release verification record: the provenance above PLUS what every
      # lane reported -- vet, the package run, race, and each W3C driver with
      # its in-scope/passed counts -- under one verdict line.
      #
      # It is a SEPARATE artifact from last-run rather than a replacement,
      # because the two answer different questions and the cheap one should
      # stay cheap: last-run says what was measured, this says what the
      # measurement found. Both are uploaded on every run, so the record is
      # never a thing that only exists on release day and is first exercised
      # when it matters.
      #
      # The name carries the tag when there is one. An artifact called
      # "release-record" on every run is not something a release can point
      # AT; one called "release-record-v1.4.0" is, and the ref is the only
      # part of a run that identifies which release it verified.
      #
      # if: always() for the reason above it: a FAILING run is when the
      # question "verified how?" actually gets asked, and a record that
      # exists only for green runs cannot answer it.
      - name: Upload the release verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-record-${{ github.ref_name }}
          path: tests/release-record.txt
          if-no-files-found: warn
